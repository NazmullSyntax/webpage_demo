<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Shop | Modern E-Commerce</title>
    <style>
        /* CSS Reset and Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #333;
        }

        /* Header & Navigation */
        header {
            background-color: #1a252f;
            color: #fff;
            padding: 1rem 5%;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #3498db;
        }

        .cart-icon {
            position: relative;
            cursor: pointer;
            font-size: 1.2rem;
            background: #3498db;
            padding: 8px 15px;
            border-radius: 20px;
            color: #fff;
        }

        .cart-count {
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 0.8rem;
            margin-left: 5px;
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://picsum.photos/1200/400') no-repeat center center/cover;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .hero h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .hero p { font-size: 1.1rem; }

        /* Main Section & Products */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 1.2rem;
            color: #27ae60;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .add-to-cart-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: auto;
            font-weight: bold;
            transition: background 0.2s;
        }

        .add-to-cart-btn:hover {
            background-color: #2980b9;
        }

        /* Cart Sidebar Drawer */
        .cart-modal {
            position: fixed;
            top: 0;
            right: -400px;
            width: 350px;
            height: 100%;
            background: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.2);
            transition: right 0.3s ease;
            z-index: 1001;
            display: flex;
            flex-direction: column;
        }

        .cart-modal.open {
            right: 0;
        }

        .cart-header {
            background: #1a252f;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-cart {
            cursor: pointer;
            font-size: 1.5rem;
        }

        .cart-items {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .cart-item-title {
            font-size: 0.9rem;
            font-weight: bold;
        }

        .remove-btn {
            color: #e74c3c;
            cursor: pointer;
            border: none;
            background: none;
            font-weight: bold;
        }

        .cart-footer {
            padding: 15px;
            border-top: 1px solid #eee;
            background: #f9f9f9;
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }

        .checkout-btn {
            width: 100%;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }

        .checkout-btn:hover {
            background-color: #219150;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 1000;
        }

        .overlay.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="navbar">
            <div class="logo">E-Shop</div>
            <div class="cart-icon" id="cart-btn">
                🛒 Cart <span class="cart-count" id="cart-count">0</span>
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to E-Shop</h1>
        <p>Discover amazing deals on top products!</p>
    </section>

    <!-- Product Showcase Section -->
    <main class="container">
        <h2 class="section-title">Featured Products</h2>
        <div class="product-grid" id="product-grid">
            <!-- Dynamic JavaScript Rendering -->
        </div>
    </main>

    <!-- Cart Modal Drawer -->
    <div class="cart-modal" id="cart-modal">
        <div class="cart-header">
            <h3>Your Shopping Cart</h3>
            <span class="close-cart" id="close-cart">&times;</span>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Dynamic Cart Items -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-price">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <!-- Background Overlay -->
    <div class="overlay" id="overlay"></div>

    <!-- JavaScript Logic -->
    <script>
        // Sample Product Data
        const products = [
            { id: 1, name: "Wireless Headphones", price: 99.99, image: "https://picsum.photos/300/200?random=1" },
            { id: 2, name: "Smart Watch", price: 149.99, image: "https://picsum.photos/300/200?random=2" },
            { id: 3, name: "Gaming Mouse", price: 49.99, image: "https://picsum.photos/300/200?random=3" },
            { id: 4, name: "Mechanical Keyboard", price: 89.99, image: "https://picsum.photos/300/200?random=4" },
            { id: 5, name: "HD Monitor", price: 199.99, image: "https://picsum.photos/300/200?random=5" },
            { id: 6, name: "Bluetooth Speaker", price: 59.99, image: "https://picsum.photos/300/200?random=6" }
        ];

        // State Management
        let cart = [];

        // DOM Elements
        const productGrid = document.getElementById('product-grid');
        const cartModal = document.getElementById('cart-modal');
        const cartBtn = document.getElementById('cart-btn');
        const closeCartBtn = document.getElementById('close-cart');
        const overlay = document.getElementById('overlay');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartCountElement = document.getElementById('cart-count');
        const cartTotalPriceElement = document.getElementById('cart-total-price');

        // Render Products
        function renderProducts() {
            productGrid.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.name}" class="product-image">
                    <div class="product-info">
                        <h3 class="product-title">${product.name}</h3>
                        <p class="product-price">$${product.price.toFixed(2)}</p>
                        <button class="add-to-cart-btn" onclick="addToCart(${product.id})">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        // Add to Cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);

            if (cartItem) {
                cartItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCartUI();
            openCart();
        }

        // Remove from Cart
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            updateCartUI();
        }

        // Update Cart UI
        function updateCartUI() {
            // Render cart items
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p>Your cart is empty.</p>';
            } else {
                cartItemsContainer.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div>
                            <div class="cart-item-title">${item.name}</div>
                            <small>$${item.price.toFixed(2)} x ${item.quantity}</small>
                        </div>
                        <div>
                            <span style="margin-right: 10px; font-weight: bold;">$${(item.price * item.quantity).toFixed(2)}</span>
                            <button class="remove-btn" onclick="removeFromCart(${item.id})">✕</button>
                        </div>
                    </div>
                `).join('');
            }

            // Update Total Count and Price
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            cartCountElement.textContent = totalItems;
            cartTotalPriceElement.textContent = `$${totalPrice.toFixed(2)}`;
        }

        // Toggle Cart Drawer
        function openCart() {
            cartModal.classList.add('open');
            overlay.classList.add('active');
        }

        function closeCart() {
            cartModal.classList.remove('open');
            overlay.classList.remove('active');
        }

        // Checkout Simulation
        function checkout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            alert("Thank you for your purchase!");
            cart = [];
            updateCartUI();
            closeCart();
        }

        // Event Listeners
        cartBtn.addEventListener('click', openCart);
        closeCartBtn.addEventListener('click', closeCart);
        overlay.addEventListener('click', closeCart);

        // Initial Initialization
        renderProducts();
    </script>
</body>
</html>
